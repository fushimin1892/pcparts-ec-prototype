name: PHP and MySQL API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-smoke-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: pc_parts_shop
          MYSQL_USER: pcparts
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: pc_parts_shop
      DB_USER: pcparts
      DB_PASSWORD: ci-db-password
      APP_ALLOWED_ORIGINS: http://127.0.0.1:8080
      SESSION_SAMESITE: Lax
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo_mysql
      - name: Lint PHP files
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify existing-database migration
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci-root-password <<'SQL'
          DROP DATABASE IF EXISTS pc_parts_shop;
          CREATE DATABASE pc_parts_shop DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          USE pc_parts_shop;
          CREATE TABLE products (name VARCHAR(255) NOT NULL, maker VARCHAR(100) NOT NULL, category VARCHAR(80) NOT NULL, specs JSON NULL);
          INSERT INTO products (name, maker, category, specs) VALUES
            ('AMD Ryzen 7 7700', 'AMD', 'CPU', JSON_OBJECT('ソケット', 'AM5')),
            ('Intel Core Ultra 7 265K', 'Intel', 'CPU', JSON_OBJECT('ソケット', 'LGA1851')),
            ('B650 board', 'GIGABYTE', 'マザーボード', JSON_OBJECT('チップセット', 'AMD B650', 'ソケット', 'AM5')),
            ('RTX 5070', 'ZOTAC', 'グラフィックボード', JSON_OBJECT());
          SQL
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci-root-password < database/migrations/20261001_categories_platform.sql
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci-root-password --batch --skip-column-names -e "SELECT COUNT(*) FROM pc_parts_shop.products WHERE (category='CPU' AND platform IN ('Intel','AMD')) OR (category='マザーボード' AND platform='AMD') OR category='GPU'" | grep -qx 4
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci-root-password -e 'DROP DATABASE pc_parts_shop'
      - name: Create schema and seed catalog
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci-root-password < database/schema.sql
          php backend/scripts/seed_catalog.php
      - name: Start PHP server and verify API
        env:
          ADMIN_PASSWORD: ci-only-test-password-012345
        run: |
          php -S 127.0.0.1:8080 -t backend/public > /tmp/pcparts-php.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health.php > /tmp/health.json; then break; fi
            sleep 1
          done
          php -r '$h=json_decode(file_get_contents("/tmp/health.json"), true); if (($h["database"] ?? "") !== "connected") exit(1);'
          curl -sS -o /tmp/unauthorized.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/products.php -H 'Content-Type: application/json' -d '{}' | grep -qx 401
          php -r '$r=json_decode(file_get_contents("http://127.0.0.1:8080/api/products.php"), true); $items=$r["items"] ?? []; $n=count(array_filter($items, fn($p) => $p["category"] === "CPU")); $intel=count(array_filter($items, fn($p) => $p["category"] === "CPU" && $p["platform"] === "Intel")); $amd=count(array_filter($items, fn($p) => $p["category"] === "CPU" && $p["platform"] === "AMD")); $categories=array_unique(array_column($items, "category")); if (count($items) !== 40 || $n !== 28 || !$intel || !$amd || !in_array("ファン", $categories, true)) { fwrite(STDERR, "Catalog taxonomy or platform seed mismatch\n"); exit(1); } echo "Public catalog: " . count($items) . " products, $n CPUs ($intel Intel / $amd AMD)\n";'
          php -r '$r=json_decode(file_get_contents("http://127.0.0.1:8080/api/products.php?platform=Intel"), true); foreach (($r["items"] ?? []) as $p) if ($p["platform"] !== "Intel") exit(1);'
          php backend/scripts/create_admin.php ci@example.test 'CI Admin'
          login_status=$(curl -sS -o /tmp/login.json -w '%{http_code}' -c /tmp/pcparts-cookie.txt -H 'Content-Type: application/json' -d '{"email":"ci@example.test","password":"ci-only-test-password-012345"}' http://127.0.0.1:8080/api/admin/login.php)
          if [ "$login_status" != 200 ]; then cat /tmp/login.json; cat /tmp/pcparts-php.log; exit 1; fi
          grep -q '"ok":true' /tmp/login.json
          status_code=$(curl -sS -o /tmp/admin-status.json -w '%{http_code}' -b /tmp/pcparts-cookie.txt http://127.0.0.1:8080/api/admin/status.php)
          if [ "$status_code" != 200 ]; then cat /tmp/admin-status.json; cat /tmp/pcparts-php.log; exit 1; fi
          grep -q '"authenticated":true' /tmp/admin-status.json
          curl -fsS -b /tmp/pcparts-cookie.txt -H 'Content-Type: application/json' -d '{"items":[{"id":"ci-bulk-amd-cpu","name":"CI Bulk AMD CPU","maker":"AMD","platform":"AMD","category":"CPU","price":1,"stock":0,"imageUrl":"https://example.test/cpu.jpg","productUrl":"https://example.test/cpu","specs":{"ソケット":"AM5"},"isDemoPrice":true},{"id":"ci-bulk-gpu","name":"CI Bulk GPU","maker":"NVIDIA","category":"GPU","price":2,"stock":0,"imageUrl":"https://example.test/gpu.jpg","productUrl":"https://example.test/gpu","specs":{},"isDemoPrice":true}]}' http://127.0.0.1:8080/api/admin/products/bulk-import.php | grep -q '"imported":2'
          curl -fsS 'http://127.0.0.1:8080/api/products.php?keyword=CI%20Bulk' | grep -q '"imageUrl":"https://example.test/cpu.jpg"'
          curl -sS -o /tmp/missing-platform.json -w '%{http_code}' -b /tmp/pcparts-cookie.txt -H 'Content-Type: application/json' -d '{"id":"ci-missing-platform","name":"Missing platform","category":"CPU","price":1,"stock":1}' http://127.0.0.1:8080/api/products.php | grep -qx 422
          curl -fsS -b /tmp/pcparts-cookie.txt -H 'Content-Type: application/json' -d '{"id":"ci-smoke-product","name":"CI smoke product","shortName":"CI smoke","maker":"AMD","platform":"AMD","category":"CPU","type":"cpu","price":1,"stock":1,"description":"CI only","specs":{"ソケット":"AM5"},"isDemoPrice":true}' http://127.0.0.1:8080/api/products.php | grep -q 'ci-smoke-product'
          curl -fsS -b /tmp/pcparts-cookie.txt -X PUT -H 'Content-Type: application/json' -d '{"name":"CI smoke product updated","shortName":"CI smoke","maker":"AMD","platform":"AMD","category":"CPU","type":"cpu","price":2,"stock":1,"description":"CI only","specs":{"ソケット":"AM5"},"isDemoPrice":true}' 'http://127.0.0.1:8080/api/products.php?id=ci-smoke-product' | grep -q '"price":2'
          curl -fsS -b /tmp/pcparts-cookie.txt -X DELETE 'http://127.0.0.1:8080/api/products.php?id=ci-smoke-product' | grep -q '"deleted":true'
